name: Update repo database

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest top repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/fetch_top_repos.py

      - name: Commit and push if changed
        run: |
          git config user.name "ai-atlas-bot"
          git config user.email "ai-atlas-bot@users.noreply.github.com"
          git add assets/repos.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: weekly refresh of top repositories"
            git push
          fi
